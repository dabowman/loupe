name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # `npm test` type-checks first, then runs every suite. esbuild strips
      # types without checking them, so the bundle building proves nothing about
      # whether the source type-checks — these have to be separate gates.
      - run: npm test

      # Every profile's patterns.md table is generated from its registry and
      # the pattern language. A stale one is the prose an agent reads before it
      # writes disagreeing with the registry the engine checks.
      - run: npm run patterns-doc:check

      # dist/ is a committed build artifact, so it can go stale in exactly one
      # way: someone edits src/ and forgets to rebuild. Locally that is
      # invisible — bin/loupe.mjs runs source wherever the deps are installed —
      # so this is the only thing standing between a src/ change and a
      # marketplace install still running the previous version of it.
      - run: npm run build:check

      # The DevTools extension carries a generated copy of the matcher, because
      # Manifest V3 forbids fetching code at runtime. `npm test` already checks
      # it is in sync — this is the same check from the repo root, so a change
      # made to the extension alone is caught too.
      - name: the extension's vendored matcher matches the engine's
        run: node ../integrations/devtools/build.mjs --check

  bundle:
    name: bundle runs with no dependencies installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No `npm install` anywhere: this is what a marketplace install looks
      # like, and the whole point of shipping dist/ is that it works there.
      - run: node engine/bin/loupe.mjs presets
      - run: node engine/bin/loupe.mjs explain layout/margin-on-child
      # The HTML report's template and client script are compiled into the
      # bundle rather than read from disk beside it, precisely so a marketplace
      # install cannot end up with an engine whose reporter is missing. This is
      # what proves that: `check` on the engine's own tree, through the bundle,
      # with nothing installed.
      - name: the bundle can render an html report
        run: |
          status=0
          node engine/bin/loupe.mjs check --all --format html --preset generic > /tmp/report.html || status=$?
          # 0 clean, 1 blocking findings — both mean it ran. 2 means it could not,
          # which is the only outcome this step is looking for.
          [ "$status" -le 1 ] || { echo "loupe could not run (exit $status)"; exit 1; }
          grep -q 'id="loupe-data"' /tmp/report.html
      # The bundle's scan workers are the bundle itself, reloaded off the main
      # thread. A worker that cannot start falls back to scanning in-process,
      # silently, so this asks the run to say which happened and fails on a
      # fallback: enough markup to clear the pool's floor, and nothing installed.
      - name: the bundle scans across workers
        run: |
          mkdir -p /tmp/many/src
          pad=$(printf 'x%.0s' $(seq 1 4000))
          for i in $(seq 1 180); do
            printf '// %s\nexport const C%s = () => <p style={{ marginBottom: 4 }}>%s</p>;\n' "$pad" "$i" "$i" > /tmp/many/src/C$i.jsx
          done
          status=0
          LOUPE_NO_CACHE=1 LOUPE_DEBUG_SCAN=1 node engine/bin/loupe.mjs check --root /tmp/many --all --preset generic > /dev/null 2> /tmp/scan.log || status=$?
          [ "$status" -le 1 ] || { cat /tmp/scan.log; exit 1; }
          cat /tmp/scan.log
          grep -q 'across [0-9]* worker' /tmp/scan.log

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Pinned, so a CLI release that changes what `plugin validate` accepts
      # cannot turn this job red on a commit that touched nothing here; bump it
      # on purpose. Neither command below needs a login or an API key.
      - run: npm install -g @anthropic-ai/claude-code@2.1.308

      # What Claude Code reads when it loads the plugin: both manifests, the
      # skills and commands plugin.json lists, hooks.json, and whether the hooks
      # module parses. A path that moved or a module that no longer parses still
      # installs from the marketplace, then fails to load — and nothing in the
      # engine job reads any of these files. Warnings (no `version`) and the
      # plugin directory's own checks (no LICENSE) do not fail it; errors do.
      - run: claude plugin validate .

      # The only runner for hooks/loupe-pane.test.tsx. It imports its kit from
      # `claude-code/testing`, which only the CLI provides, so `npm test` cannot
      # reach it: without this, a change that breaks the pane leaves CI green.
      - run: claude plugin test .

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The extension is unbundled: vscode-languageclient goes into the .vsix
      # straight from node_modules. A lock out of step with package.json's
      # dependencies is an extension nobody can package.
      - run: npm ci

      # `vsce ls` runs packaging's manifest checks — it rejects an @types/vscode
      # newer than engines.vscode — and lists what the .vsix would carry, with no
      # publisher login (only `publish` needs one). The grep is for the mistake
      # .vscodeignore warns about: leaving node_modules out still lists cleanly,
      # and packages a .vsix that installs and then fails on activation.
      - name: the package manifest is consistent and carries its runtime dependency
        run: |
          npx --yes @vscode/vsce@4.0.0 ls > /tmp/vsix-files.txt
          grep -q '^node_modules/vscode-languageclient/' /tmp/vsix-files.txt

  # The DevTools extension's end-to-end check, integrations/devtools/check.mjs,
  # is manual and has no job here. It drives both panes in Chromium through
  # Playwright, which this repo deliberately does not depend on, so a job would
  # install an unpinned browser stack on every push; its header says when to
  # run it by hand. The part of the extension that can drift without a browser,
  # its vendored copy of the matcher, is the engine job's `build.mjs --check`.
